name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests (offline, sqlite)
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./test_servicesync.db"
          SECRET_KEY: "ci-secret-key-must-be-at-least-32-bytes-long-xxxxxx"
          AI_PROVIDER: "ollama"
          DEMO_MODE: "True"
        run: python -m pytest -q
